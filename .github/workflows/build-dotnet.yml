name: Build .NET Project

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: 'The .NET SDK version to use (e.g., 10.0.x)'
        required: true
        type: string
        default: '10.0.x'
      project-path:
        description: 'Path to the .csproj file (e.g., src/MyProject.csproj)'
        required: true
        type: string
      publish-blazor:
        description: 'Whether to publish Blazor WebAssembly (true/false)'
        required: false
        type: boolean
        default: false
    secrets:
      nuget-token:
        description: 'NuGet token for private packages'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      gitversion-semver: ${{ steps.gitversion.outputs.semVer }}
      gitversion-nugetversion: ${{ steps.gitversion.outputs.nuGetVersionV2 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '5.x'

      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1
        with:
          useConfigFile: true  # If you have GitVersion.yml in your repo; remove if not
          fetchAll: true

      - name: Restore dependencies
        run: dotnet restore ${{ inputs.project-path }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.nuget-token }}

      - name: Build project with versioning
        run: dotnet build ${{ inputs.project-path }} --no-restore --configuration Release /p:Version=${{ steps.gitversion.outputs.semVer }} /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }} /p:AssemblyInformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Run tests
        run: dotnet test ${{ inputs.project-path }} --no-build --verbosity normal --configuration Release

      - name: Publish Blazor WebAssembly (if enabled)
        if: inputs.publish-blazor == true
        run: dotnet publish ${{ inputs.project-path }} --configuration Release --output ./publish /p:BlazorEnableCompression=true /p:Version=${{ steps.gitversion.outputs.semVer }} /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }} /p:AssemblyInformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}