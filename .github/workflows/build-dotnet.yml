name: Build .NET Project

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: 'The .NET SDK version to use (e.g., 10.0.x)'
        required: true
        type: string
        default: '10.0.x'
      project-path:
        description: 'Path to the .csproj file (e.g., src/MyProject.csproj)'
        required: true
        type: string
      publish-blazor:
        description: 'Whether to publish Blazor WebAssembly (true/false)'
        required: false
        type: boolean
        default: false
    secrets:
      nuget-token:
        description: 'NuGet token for private packages'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      gitversion-semver: ${{ steps.gitversion.outputs.SemVer }}
      gitversion-nugetversion: ${{ steps.gitversion.outputs.NuGetVersion }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          
      - name: Install GitVersion.Tool
        run: dotnet tool install --global GitVersion.Tool
        
      - name: Execute GitVersion
        id: gitversion
        run: |
          echo "Running GitVersion"
          GITVERSION_JSON=$(dotnet-gitversion /output json /verbosity diagnostic 2>&1) || true
          
          if echo "$GITVERSION_JSON" | jq empty >/dev/null 2>&1; then
            echo "GitVersion succeeded → using real values"
            
            # Extract specific values (optional, but keep for logging)
            SEMVER=$(echo "$GITVERSION_JSON" | jq -r .SemVer)
            NUGETVER=$(echo "$GITVERSION_JSON" | jq -r .NuGetVersion // .SemVer)  # Use NuGetVersion if available, fallback to SemVer
            ASMVER=$(echo "$GITVERSION_JSON" | jq -r .AssemblySemVer)
            
            # Set all properties as step outputs
            echo "$GITVERSION_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_OUTPUT
            
          else
            echo "GitVersion failed → using fallback version"
            SEMVER="0.0.0-ci.${{ github.run_number }}"
            NUGETVER="0.0.0-ci.${{ github.run_number }}"
            ASMVER="0.0.0.0"
            
            # For fallback, manually set outputs (expand as needed with other props)
            echo "SemVer=$SEMVER" >> $GITHUB_OUTPUT
            echo "NuGetVersion=$NUGETVER" >> $GITHUB_OUTPUT
            echo "AssemblySemVer=$ASMVER" >> $GITHUB_OUTPUT
            echo "Major=0" >> $GITHUB_OUTPUT
            echo "Minor=0" >> $GITHUB_OUTPUT
            echo "Patch=0" >> $GITHUB_OUTPUT
            # Add more fallback props if desired, e.g., PreReleaseTag=""
          fi
          
          # Log final calculated versions
          echo "Final calculated versions:"
          echo "  SemVer:        $SEMVER"
          echo "  NuGet version: $NUGETVER"
          # Optionally print all outputs here for debugging: cat $GITHUB_OUTPUT | grep '^'

      - name: Restore dependencies
        run: dotnet restore ${{ inputs.project-path }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.nuget-token }}

      - name: Build project with versioning
        run: dotnet build ${{ inputs.project-path }} --no-restore --configuration Release /p:Version=${{ steps.gitversion.outputs.SemVer }} /p:AssemblyVersion=${{ steps.gitversion.outputs.AssemblySemVer }} /p:FileVersion=${{ steps.gitversion.outputs.AssemblySemFileVer }} /p:InformationalVersion=${{ steps.gitversion.outputs.InformationalVersion }} /p:AssemblyInformationalVersion=${{ steps.gitversion.outputs.InformationalVersion }}

      - name: Run tests
        run: dotnet test ${{ inputs.project-path }} --no-build --verbosity normal --configuration Release

      - name: Publish Blazor WebAssembly (if enabled)
        if: inputs.publish-blazor == true
        run: dotnet publish ${{ inputs.project-path }} --configuration Release --output ./publish /p:BlazorEnableCompression=true /p:Version=${{ steps.gitversion.outputs.SemVer }} /p:AssemblyVersion=${{ steps.gitversion.outputs.AssemblySemVer }} /p:FileVersion=${{ steps.gitversion.outputs.AssemblySemFileVer }} /p:InformationalVersion=${{ steps.gitversion.outputs.InformationalVersion }} /p:AssemblyInformationalVersion=${{ steps.gitversion.outputs.InformationalVersion }}