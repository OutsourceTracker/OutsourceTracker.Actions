name: Build .NET Project

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: 'The .NET SDK version to use (e.g., 10.0.x)'
        required: true
        type: string
        default: '10.0.x'
      project-path:
        description: 'Path to the .csproj file (e.g., src/MyProject.csproj)'
        required: true
        type: string
      publish-blazor:
        description: 'Whether this is a Blazor WebAssembly project (true/false)'
        required: false
        type: boolean
        default: false
      artifact-name:
        description: 'Custom name for the uploaded publish artifact (overrides default)'
        required: false
        type: string
        default: ''
    secrets:
      nuget-token:
        description: 'NuGet token for private packages'
        required: false
    outputs:
      gitversion-semver:
        description: 'The calculated SemVer from GitVersion'
        value: ${{ jobs.build.outputs.gitversion-semver }}
      gitversion-nugetversion:
        description: 'The calculated NuGet version from GitVersion'
        value: ${{ jobs.build.outputs.gitversion-nugetversion }}
      gitversion-assemblysemver:
        description: 'The calculated AssemblySemVer from GitVersion'
        value: ${{ jobs.build.outputs.gitversion-assemblysemver }}
      gitversion-assemblysemfilever:
        description: 'The calculated AssemblySemFileVer from GitVersion'
        value: ${{ jobs.build.outputs.gitversion-assemblysemfilever }}
      gitversion-informationalversion:
        description: 'The calculated InformationalVersion from GitVersion'
        value: ${{ jobs.build.outputs.gitversion-informationalversion }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      gitversion-semver: ${{ steps.gitversion.outputs.semVer }}
      gitversion-nugetversion: ${{ steps.gitversion.outputs.nuGetVersionV2 }}
      gitversion-assemblysemver: ${{ steps.gitversion.outputs.assemblySemVer }}
      gitversion-assemblysemfilever: ${{ steps.gitversion.outputs.assemblySemFileVer }}
      gitversion-informationalversion: ${{ steps.gitversion.outputs.informationalVersion }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '5.x'

      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v1
        with:
          useConfigFile: true
          fetchAll: true

      - name: Restore dependencies
        run: dotnet restore ${{ inputs.project-path }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.nuget-token }}

      - name: Build project with versioning
        run: >
          dotnet build ${{ inputs.project-path }}
          --no-restore
          --configuration Release
          /p:Version=${{ steps.gitversion.outputs.semVer }}
          /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }}
          /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }}
          /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}
          /p:AssemblyInformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}

      - name: Run tests
        run: dotnet test ${{ inputs.project-path }} --no-build --verbosity normal --configuration Release

      - name: Publish project
        id: publish
        run: >
          dotnet publish ${{ inputs.project-path }}
          --configuration Release
          --output ./publish
          --no-restore
          /p:Version=${{ steps.gitversion.outputs.semVer }}
          /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }}
          /p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }}
          /p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}
          /p:AssemblyInformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}
          ${{ inputs.publish-blazor == true && '/p:BlazorEnableCompression=true' || '' }}

      - name: Upload Publish Artifact
        if: always() && steps.publish.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name != '' && inputs.artifact-name || (inputs.publish-blazor == true && 'blazor-publish' || 'dotnet-publish') }}
          path: ./publish/
          if-no-files-found: error
          retention-days: 7